# agent-tmux: show pane labels (set via `tmux-bridge name`) in pane borders.
# Sourced from ~/.tmux.conf by install.sh.
set -g pane-border-status top
set -g pane-border-format " #{?@name,#{@name},#{b:pane_current_path}} "

# swarm: re-lay out swarm-tagged windows shortly after Claude Code's own layout
# pass. Global hooks (set-hook -w isn't window-scoped); `swarm _retile-session`
# returns at once for sessions with no swarm window. #{q:session_name} is
# shell-escaped by tmux and must stay unquoted: inside "" a name with " or $
# would break out of the quotes and run.
set-hook -g 'after-split-window[90]' "run-shell -b '[ -x \"$HOME/.local/bin/swarm\" ] && \"$HOME/.local/bin/swarm\" _retile-session #{q:session_name} || true'"
set-hook -g 'after-kill-pane[90]'    "run-shell -b '[ -x \"$HOME/.local/bin/swarm\" ] && \"$HOME/.local/bin/swarm\" _retile-session #{q:session_name} || true'"
